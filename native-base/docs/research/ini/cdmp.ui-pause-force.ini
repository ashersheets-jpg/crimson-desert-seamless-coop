; cdmp.ini - rama opcion-d, P8 pausa del ESC, prueba T1 (FORCE, un PC, un jugador, sin Shadow).
; Documento: docs/research/pendientes/p8-pausa-esc.md, seccion "Implementado", T1.
; ESCRIBE en el juego: el gancho de 0x35CD990 devuelve 1.0 en vez de la pausa/ralentizacion de CUALQUIER menu,
; haya o no otro jugador. Con un menu abierto el mundo sigue: enemigos, reloj, hora del dia, temporizadores.
; Partida de laboratorio; copia de las partidas antes (las reales estan apartadas). El guardian de guardado no
; se activa (no hay create_session): guardar desde el menu es parte de lo que se prueba, con cuidado.
; Lineas a buscar: 'UiPause ON (force (always)', 'UiPause [force (always)] ... BLOCKED', 'UiPause clock: ... +5000 ms'.
[general]
player_name=Player

[net]
enabled=0

[overlay]
enabled=1
self_marker=0

[sniffer]
; ServerTimeInfoAck 2188 del cliente propio: el tick debe avanzar con el menu abierto (analyze_capture.py ... ticks)
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
ui_pause_block=force
