; cdmp.ini - rama opcion-d, P8 en el ANFITRION (variante SIN identity_fix): Shadow entra como usuario 2 por Steam.
; Todo lo de 2026-10-09 activo (C4/C4r, reloj, identidad F002, D-52/D-53) + sonda de companeros (solo lectura).
; Escribe en el juego: guardian de guardado (no se puede guardar) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
; imprescindible: sin el, un reinicio de Shadow mata el tunel hasta reiniciar el juego
reconnect=1
clock_gate=1
; diagnostico: sin el arreglo de identidad (el titulo de Shadow no deja cargar con F002?)
identity_fix=0
child_hold=1
; solo lectura: cuenta 2042 y registra la creacion de companeros
companion_probe=1
