; cdmp.ini - rama opcion-d, prueba E3b (T07): el usuario 2 entra en el campo del anfitrion (share_field)
; Escribe en el juego: se activan el guardian (no se puede guardar) y K1 (no salen informes).
; K2: crashpad_handler.exe apartado (scripts\crashpad.ps1). Partida de laboratorio: ranura 108.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=0

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
; E3b: H1 + H2, el usuario 2 comparte tu ServerField si viaja a tu nivel
share_field=1
