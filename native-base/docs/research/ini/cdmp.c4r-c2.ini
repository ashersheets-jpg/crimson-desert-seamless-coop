; C4r + C2-0: reconexion y sonda de identidad (solo lectura) en la misma partida
; cdmp.ini - rama opcion-d, prueba C4r (C4, reconexion): el usuario 2 sale y vuelve a entrar en la misma partida
; = cdmp.c1f.ini + [session2] reconnect=1 (opcion-d-pruebas.md, C4r; guest_lifecycle.h)
; base, cdmp.c1f.ini: prueba C1f (T07, E3b + P5): campo compartido y relevo de acciones (relay_fix)
; Escribe en el juego: se activan el guardian (no se puede guardar) y K1 (no salen informes).
; K2: crashpad_handler.exe apartado (scripts\crashpad.ps1). Partida de laboratorio: ranura 108.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=0

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
; E3b: H1 + H2, el usuario 2 comparte tu ServerField si viaja a tu nivel
share_field=1
; P5: el relevo "excepto el que controla" (vaciado en esta build) manda al otro usuario las acciones
relay_fix=1
; C4r: tras la salida del usuario 2 y una barrera limpia, una conexion NUEVA de cdmp_peer entra con otra epoca
reconnect=1
; C2-0: sonda de identidad de solo lectura
identity_probe=1
