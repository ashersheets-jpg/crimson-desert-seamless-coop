; cdmp.ini - rama opcion-d, pruebas RPT-1 + A4 juntas
; RPT-1: el juego sin crashpad_handler.exe (K2) arranca y va normal.
; A4: cargar la partida de capitulo 2 (ranura 108) y marcar con Ctrl+F12 el control libre.
; Solo lectura: la sonda no escribe en el juego y el guardian sigue apagado.
[general]
player_name=Player

[net]
; hace falta: las marcas de Ctrl+F12 las escribe el bucle de red (no conecta con nadie)
enabled=1
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
; graba cdmp_packets_<fecha>.bin/.log: la carga de la partida plantilla
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
finder_log=0
