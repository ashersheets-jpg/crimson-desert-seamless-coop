; C2: characterNo propio del usuario 2 (identity_fix=1, pendientes/identidad.md seccion 5) sobre D-53 (cdmp.d53.ini).
; El lobby del usuario 2 (0x2B7F4D0, antes del 2869) y su Status (al volver de 0x20688A0, antes de 0x2941020, 2358 y
; empaquetador) pasan de 0x7FFFFFFFFFFFFFFF a 0x7FFFFFFFFFFFF002; el anfitrion se queda con 7FFF. En 0x2941020 se
; comprueba lobby = Status = F002; si falla: ERROR y salida nativa del usuario 2. Si el arreglo no se instala, la
; opcion D rechaza los logins del usuario 2 (2490/3093). Esperado: "C2 identity: user 2 lobby ... -> 0x7FFFFFFFFFFFF002",
; "status ... -> ...F002", "invariant ok"; la sonda C2-0 muestra F002 en phases/2358/packer del usuario 2 y 7FFF en
; el anfitrion; el guion aprende CHARACTER_NO del 2869 (debe ser F002) y lo manda en el 3093; guion 25/25, ningun cierre.
; D-53: retencion de los hijos del usuario 2 en el servidor (child_hold=1, pendientes/companeros-publicacion.md seccion 3)
; sobre COMP-A (cdmp.comp.ini, con la que el hijo del usuario 2 se crea). NotifyAppear 0x2B000C0 manda el hijo con
; restauracion 0 solo a la sesion del usuario 2; al anfitrion se le anuncia (NotifyAppear nativo) cuando el servidor
; acepta su primera accion (byte 1). cdmp_peer nunca le da accion: resultado esperado = el anfitrion no ve nunca al
; hijo, ningun cierre (ni al aparecer ni ~1 s tras la salida en 0x17F328F), "held" 1 por login, ningun "released",
; "CompHold timeout" a los 3 s y la tabla vaciada al salir. D-52 sigue instalada como red.
; COMP-A: sonda de companeros de solo lectura (companion_probe=1, pendientes/companeros.md seccion A) sobre C2-0
; (cdmp.c2probe.ini), que reproduce el cierre en exe+0x232D5FF con el hijo del usuario 2. Registra CompCreate (rama de
; creacion), CompAction (restauracion antes/despues), CompCrash (actor y capas justo antes del cierre) y entradas 2042.
; No evita el cierre. Mismo guion y ranura que C2-0.
; C2-0: sonda de identidad de solo lectura (identity_probe=1, pendientes/identidad.md §6) sobre la configuracion de C1f
; cdmp.ini - rama opcion-d, prueba C1f (T07, E3b + P5): campo compartido y relevo de acciones (relay_fix)
; Escribe en el juego: se activan el guardian (no se puede guardar) y K1 (no salen informes).
; K2: crashpad_handler.exe apartado (scripts\crashpad.ps1). Partida de laboratorio: ranura 108.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=0

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
; E3b: H1 + H2, el usuario 2 comparte tu ServerField si viaja a tu nivel
share_field=1
; P5: el relevo "excepto el que controla" (vaciado en esta build) manda al otro usuario las acciones
relay_fix=1
; C2-0: sonda de solo lectura del characterNo del usuario 2 (carga de componentes, Status, 2358, version global)
identity_probe=1
; COMP-A: sonda de companeros (creacion de hijos, restauracion, nulo de 0x232D5C0, 2042), solo lectura
companion_probe=1
; D-53: el hijo con restauracion 0 solo llega a su dueno; los demas lo reciben tras su primera accion
child_hold=1
; C2: characterNo propio del usuario 2 (lobby y Status = 0x7FFFFFFFFFFFF002). Por defecto 1 con create_session=1
identity_fix=1
