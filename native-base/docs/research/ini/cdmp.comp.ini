; COMP-A: sonda de companeros de solo lectura (companion_probe=1, pendientes/companeros.md seccion A) sobre C2-0
; (cdmp.c2probe.ini), que reproduce el cierre en exe+0x232D5FF con el hijo del usuario 2. Registra CompCreate (rama de
; creacion), CompAction (restauracion antes/despues), CompCrash (actor y capas justo antes del cierre) y entradas 2042.
; No evita el cierre. Mismo guion y ranura que C2-0.
; C2-0: sonda de identidad de solo lectura (identity_probe=1, pendientes/identidad.md §6) sobre la configuracion de C1f
; cdmp.ini - rama opcion-d, prueba C1f (T07, E3b + P5): campo compartido y relevo de acciones (relay_fix)
; Escribe en el juego: se activan el guardian (no se puede guardar) y K1 (no salen informes).
; K2: crashpad_handler.exe apartado (scripts\crashpad.ps1). Partida de laboratorio: ranura 108.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=0

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
; E3b: H1 + H2, el usuario 2 comparte tu ServerField si viaja a tu nivel
share_field=1
; P5: el relevo "excepto el que controla" (vaciado en esta build) manda al otro usuario las acciones
relay_fix=1
; C2-0: sonda de solo lectura del characterNo del usuario 2 (carga de componentes, Status, 2358, version global)
identity_probe=1
; COMP-A: sonda de companeros (creacion de hijos, restauracion, nulo de 0x232D5C0, 2042), solo lectura
companion_probe=1
