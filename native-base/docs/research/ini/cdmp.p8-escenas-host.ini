; cdmp.ini - rama opcion-d, P8: escenas propias del usuario 2 (ESC 'ver objeto') y efecto secundario de observer_hold.
; Documento: docs/research/pendientes/p8-escenas-y-acks.md. ANFITRION con Shadow. Shadow: cdmp.p8-2322-shadow.ini (sin cambios).
; = cdmp.p8-2322-host-B.ini + observer_scene_copy=1 + observer_hold_acks=1 (al final de [session2]).
; Control (comportamiento anterior): las dos claves nuevas a 0. Cada una se puede apagar por separado.
; Escribe en el juego: guardian de guardado (no se puede guardar) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en A y en B (y en Shadow)
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del cliente propio del anfitrion (cdmp_packets_*.bin en bin64): imprescindible para el cruce
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
companion_probe=1
; S3 (retencion de publicacion): necesaria para observer_hold_acks
observer_hold=1
; S2/S1 solo lectura: sondas de la rama de dueno 0x2BC8470, ruta 0x287F1CC, UI ExtraReward (load_diag) y S1 (s1_diag)
load_diag=1
s1_diag=1
; libro de escenas/secuenciadores (solo medida; =2 NUNCA envia nada). Da las lineas 'ObserverStage [2810 ...]' con corr=
observer_stage_sync=1
; P8 S2 (aceptado en la sesion 6B): el 2322 nativo para el observador
observer_milestone=1
observer_milestone_send=1
; P8 (p8-escenas-y-acks.md §2): el 2810 de una escena PROPIA del usuario 2 que el servidor cierra hacia el Kliff del
; anfitrion se emite tambien para el usuario 2 (emisor nativo 0x2A4E4C0, hilo logico). Lineas 'ObserverSceneCopy [...]'.
observer_scene_copy=1
; P8 S3 (§3): los 2723/2404/... de un NPC retenido para el usuario 2 esperan a su 2005 y salen justo detras, en orden.
; Medida en el describe: 'observer hold acks: ...'.
observer_hold_acks=1
