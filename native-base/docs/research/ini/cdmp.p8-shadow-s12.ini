; cdmp.ini - rama opcion-d, P8 en SHADOW (invitado real) CON LAS SONDAS S1/S2 (solo lectura).
; Igual que cdmp.p8-shadow-diag.ini mas dos claves (docs/research/pendientes/p8-impl-s1s2.md):
;   guest_actor_diag=1   diagnostico de actores del anfitrion; desde S1/S2 tambien captura las capas DESPUES de
;                        0x8646D0, recorre la lista de espera entera (hasta 1024 claves, con no legibles) y
;                        registra cada transicion de [P+0x15C] cuando ocurre (0x7798D0). Lineas "GuestDiag".
;   guest_layer_guard=1  guarda de capas del cooperativo para todo actor cuyo +0x90 no es el usuario local.
;   load_diag=1          S2: 0x779E48 / 0x779E77 (los dos predicados del estado 0x11, con el primer bloqueo
;                        legible de 0xA97D60), 0xB87890 / 0xB87A67 (el hito 2322 y su M). Lineas "P8Probe".
;   s1_diag=1            S1: 0x24314C0 (solo 837487D4 / 35DD392F), 0x86392A, 0xA79770, 0xA79BAC / 0xA79F4C,
;                        0x9ED431 / 0x9ED47F. Lineas "P8Probe ... S1". Comparar por clave con el log del anfitrion
;                        (cdmp.p8-host.ini con s1_diag=1).
; record=1: el sniffer graba cdmp_packets_*.log/.bin; las lineas P8Probe llevan "capture t=" de esa captura.
; Una sola sesion de diagnostico; para jugar normal, vuelve a cdmp.p8-shadow.ini.
[general]
player_name=Shadow

[net]
enabled=1
transport=steam
role=guest

[steam]
; Vacio = el unico amigo que este jugando a Crimson Desert ahora mismo (el anfitrion).
peer_steamid=
channel=67

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
guest=1
guest_mode=remote
guest_actor_diag=1
guest_layer_guard=1
load_diag=1
s1_diag=1
