; cdmp.ini - rama opcion-d, P8 S2 / 2322 del observador, ANFITRION, TRAMO B (EXPERIMENTO S2).
; Documento: docs/research/pendientes/p8-2322-observador.md. Mismo cdmp.asi en los dos tramos y en Shadow.
; = cdmp.p8-2322-host-A.ini con UNA sola diferencia: observer_milestone_send=1 (emite el 2322 nativo, una vez por viaje).
; Volver a A (desactivar): observer_milestone_send=0. Todo lo demas, identico a A.
; Escribe en el juego: guardian de guardado (no se puede guardar) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en A y en B (y en Shadow)
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del cliente propio del anfitrion (cdmp_packets_*.bin en bin64): imprescindible para el cruce
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
companion_probe=1
; S3 (retencion de publicacion): igual en A y en B
observer_hold=1
; S2/S1 solo lectura: sondas de la rama de dueno 0x2BC8470, ruta 0x287F1CC, UI ExtraReward (load_diag) y S1 (s1_diag)
load_diag=1
s1_diag=1
; libro de escenas/secuenciadores (solo medida; =2 NUNCA envia nada)
observer_stage_sync=1
; P8 S2: misma decision que en A y, si dice que si, EMITE en el hilo logico: 0x2A757A0 (ToTarget) + 0x2999D80:
; lineas 'ObserverMilestone [decision] ... EMIT NOW', '[our 2322] ... queued', '[called] ...', '[2762] ...'
observer_milestone=1
observer_milestone_send=1
; P8 pausa del ESC (pendientes/p8-pausa-esc.md, "Implementado", T3): con el usuario 2 dentro, los menus del
; anfitrion (ESC, mapa, inventario, ajustes...) NO pausan el mundo. Apagado hasta pasar T0-T2 en un PC.
; Para T3 quitar el ';' (probe = solo registrar; force = siempre, solo para pruebas de un PC):
;ui_pause_block=1
; P8 S1 escenas de NPC, SOLO MEDIDA (pendientes/p8-s1-escenas-npc.md, "Implementado para la medida"): H1 bandera
; 0x2D3 del StartActionReq en el servidor, H2 enlace de los NPC de escena en el cliente propio, H3 libro de escenas y
; posicion del primer 2005 de NPC de cada viaje del usuario 2. Apagado aqui; encendido en cdmp.p8-s1-host.ini.
;s1_scene_diag=1
