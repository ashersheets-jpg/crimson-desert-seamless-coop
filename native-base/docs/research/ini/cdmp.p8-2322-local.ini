; cdmp.ini - rama opcion-d, P8 S2 / 2322 del observador en UN PC: anfitrion con cdmp_peer (usuario 2 sin cliente real).
; Documento: docs/research/pendientes/p8-2322-observador.md, seccion 'Prueba en un PC'.
; = cdmp.p8-local.ini + observer_milestone_send=1. Sin cliente real del usuario 2 solo se comprueba el lado del
; anfitrion: una emision por viaje, a la sesion 2, despues de su 2144 y su 3066, y la cancelacion al salir/reconectar.
; Para el control sin emision: observer_milestone_send=0 (deja observer_milestone=1).
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
observer_hold=1
load_diag=1
observer_stage_sync=1
observer_milestone=1
observer_milestone_send=1
; P8 pausa del ESC, prueba T2 (pendientes/p8-pausa-esc.md, "Implementado"): con el usuario 2 de cdmp_peer
; dentro, los menus del anfitrion no pausan el mundo. Para T2 quitar el ';' (y usar el guion soak_child):
;ui_pause_block=1
