; P8 sesion 28, PASO 1 (invitado, Shadow): cuerda (remote_rope) ACTIVA (probada en la S27); volver a entrar, reenlace y gimmicks acoplados SOLO MEDIDOS. Paso 2: cdmp.p8-s28-shadow-paso2.ini.
; P8 sesion 26 (invitado, los dos pasos): partida propia, clima del anfitrion (modo visor) y clase de combate ACTIVOS. El paso lo cambia solo el anfitrion, salvo la cuerda del gancho (remote_rope=probe aqui; =1 en cdmp.p8-s26-shadow-paso2.ini).
; P8 sesion 25, PASO 2 (invitado): clase de combate, clima del anfitrion (modo visor) y partida propia ACTIVOS.
; cdmp.ini - rama opcion-d, P8 SESION 7 en SHADOW: invitado real con sondas (solo lectura), captura de cierres, tunel comprimido
; y menus sin pausa mientras juega en el anfitrion. crashpad_handler.exe fuera de bin64 (K2).
; Sesion 8 (pendientes/p8-impl-log-async.md): log asincrono en el mod; aqui menos sondas de log (guest_s3_diag, load_diag,
; s1_diag, guest_scene_diag a 0) y divergence_probe=1.
; Reproduccion de escenas copiadas (pendientes/p8-impl-escenas-play.md): guest_seq_play=1 y guest_seq_play_live=0 (solo
; fase 1) al final de [session2]; como apagarlo, alli.
; Documento: docs/research/pendientes/p8-s1-escenas-npc.md, seccion "Implementado para la medida". Mismo cdmp.asi que
; el anfitrion (cdmp.p8-s1-host.ini).
; = cdmp.p8-2322-shadow.ini con UNA sola diferencia: guest_scene_diag=1 (sondas G1-G4, solo lectura: no escribe en el
; juego, no llama a funciones del juego, no envia ni retiene nada). Volver: guest_scene_diag=0.
; Lineas nuevas en cdmp.log: 'GuestScene [...]' (G1 bloque de IA y handle de cada NPC; G2 replica del contenedor
; NPCScheduleManager por recurso; G3 el gestor X del Kliff del anfitrion; G4 primer C>S de escena por opcode e id) y
; resumenes 'GuestScene [G1|G2|G4 summary]' cada 60 s, todo desde el hilo de diagnostico (cada 5 s).
; guest_stage_diag=1 sigue dando las lineas 'GuestStage' (vf13 0x9ED290, rutas 2661/2981/2810) para el cruce.
; crashpad_handler.exe sigue fuera de bin64 (K2).
[general]
player_name=Shadow

[net]
enabled=1
transport=steam
role=guest

[steam]
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en el anfitrion y en Shadow
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del invitado (cdmp_packets_*.bin): imprescindible para el cruce con el anfitrion
; COSTE (sesion 8, p8-impl-log-async.md §1.3): ~0,3 MB/s a disco (310 MB en 16 min de sesion 8), el mayor escritor del
; invitado; con el disco de Shadow lento es la sospecha principal de los WriteFile de 5-9 s. Desde la sesion 8 va por
; una cola en memoria (1 + 4 MB) con su hilo: un disco lento ya no para ni el juego ni el hilo de red ni el log
; (pierde registros de la grabacion, contados en '# DISK QUEUE' y marcados con registros de hueco en el .bin).
; record=0 quita esa E/S y mantiene contadores y
; tap. Decision del usuario: sin tocar.
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
guest=1
; P8 sesion 24: guardado desviado (pendientes/p8-guardado-desviado.md); PLAN B: save_guard=1. Hoy el guardian de guardado
;   solo arranca en el anfitrion (con sus etapas que escriben en el juego): en el invitado esta linea aun no instala nada.
save_guard=redirect
guest_mode=remote
; P8 reentrada (research/s25/reentrada.md, "Implementado"): tras salir al titulo, Continuar vuelve al mundo del
;   anfitrion en el mismo arranque si el anfitrion lo admite (su rejoin=1). 0 | probe | 1. probe = solo registra lo que
;   haria (la conexion siguiente sigue siendo local, como antes).
rejoin=probe
; P8 sesion 25: partida propia del invitado, fase B (noche/progreso-invitado.md, "Implementado (fase B)"). 0 | probe | 1.
;   probe = al arrancar se elige la ranura que cargaria "Continuar" (save.save mas reciente de 0-2 / 100-108 de TU
;   carpeta de partidas), se comprueba y se sube al anfitrion por el tunel (SAVE_OFFER + trozos) en cuanto el anfitrion
;   habla; las partidas que el anfitrion devuelva se guardan en %LOCALAPPDATA%\cdmp\guest_progress\<anfitrion>\incoming\
;   genN\ (NUNCA en tu carpeta de partidas). No retiene nada del cliente ni anade ninguna Req. Lineas
;   'Session2 guest save:'. 1 = ademas el 3093 espera el SAVE_ACK del anfitrion (30 s como mucho) y la despedida espera
;   un guardado final (3037, 15 s como mucho). Aplicar con el juego CERRADO: tools\scripts\aplicar-progreso-invitado.ps1.
;   Apagar: 0.
guest_own_save=1
; P8 sesion 25: hora y clima (research/noche/clima-hora.md, seccion "Implementado"). clock_probe=1: linea
;   'ClockProbe [guest]' cada 5 s, SOLO LECTURA (reloj cliente exe+0x6A6D218 y servidor exe+0x6A6D238 con su t0, gestor
;   de hora +0x28..+0x57, desfase 2188, y los 2816/2762 entregados al cliente). Se compara con la 'ClockProbe [host]':
;   t0 del reloj CLIENTE del invitado frente al t0 del reloj SERVIDOR del anfitrion, a menos de 2000 ms de juego. Apagar: 0.
clock_probe=1
; P8 sesion 25: clima del anfitrion en el invitado (modo visor; research/noche/clima-sincronizar.md, "Implementado").
;   weather_sync=probe: linea 'WeatherSync [probe guest]' cada 5 s, SOLO LECTURA (no escribe, no llama, no envia nada;
;   por eso tambien en el plan B), para compararla con la 'WeatherSync [probe host]': X, X+0x31, el vector, tick % 60000.
;   Con 1 el invitado anuncia caps 0x04 y escribe el clima del anfitrion en modo visor (gancho en la entrada de
;   0x3DC4730) si esta a menos de weather_sync_radius_m (2000 m por defecto) del anfitrion. Apagar: 0.
weather_sync=1
guest_actor_diag=1
guest_layer_guard=1
; P8 sesion 8 (pendientes/p8-impl-log-async.md §4): MENOS LOG en el invitado. Las sondas de solo medida que mas
; escriben quedan a 0: guest_s3_diag (historial S3 cada 5 s; la captura de cierres sigue con guest_crash_dump=1),
; P8Probe (load_diag, s1_diag) y guest_scene_diag (G1-G4). Siguen: guest_seq_route/guest_seq_watch (escenas: con
; load_diag=0 y guest_stage_diag a 1 el 2322 lo engancha guest_seq_route por su cuenta), guest_stage_diag,
; guest_actor_diag, la captura de cierres y todo el movimiento (remote_*, dismount/divergence_probe). Volver: a 1.
guest_s3_diag=0
guest_crash_dump=1
guest_update_guard=1
load_diag=0
s1_diag=0
guest_stage_diag=1
; P8 S1 escenas de NPC, SOLO MEDIDA (pendientes/p8-s1-escenas-npc.md, "Implementado para la medida"): G1 bloque de IA
; de cada NPC, G2 replica de lectura del contenedor NPCScheduleManager, G3 el gestor X del Kliff del anfitrion, G4
; C>S de escena del invitado. A 0 desde la sesion 8 (volumen de log).
guest_scene_diag=1
tunnel_compress=1
ui_pause_block=1
; P8 juego del usuario 2 (pendientes/p8-impl-rango-embudos.md): solo anfitrion; en el invitado no se instala nada.
rank_permit=0
quest_per_user=0
kill_loot_per_user=0
; P8 SESION 15, VIAJE RAPIDO (pendientes/p8-impl-viaje-rapido.md). SOLO INVITADO; 0 | probe | 1.
;   1 = F1: el viaje rapido del mapa (0x655110) no hace nada mientras juegas en el anfitrion y el HUD lo avisa.
;   probe = viaje nativo + linea 'GuestFastTravel' con sus argumentos (necesita user2_fast_travel=1 en el anfitrion).
;   SESION 15: probe para probar F3; si el viaje acaba en el titulo, en una carga de mas de 60 s o en crash -> 1.
guest_fast_travel_veto=probe
; P8 SESION 15, RECARGA EN EL MISMO CAMPO (pendientes/p8-s15-viaje-tunel.md §8). SOLO INVITADO; 0 | probe | 1.
;   Necesita guest_actor_diag=1. probe = lineas 'GuestReloadWait [trace|still]' (la maquina de carga por viaje) y
;   'GuestReloadWait [0x12 BLOCKER|WOULD DROP]' (el actor al que espera el estado 0x12, con su edad e hijos).
;   1 = ademas quita de la lista de espera (como 0x12 quita los listos) un NPC del anfitrion que ya estaba NOT READY
;   (+5E 8) al empezar una RECARGA (2643 sin 2174), tras 2 s en 0x12, 128 por viaje como mucho: 'GuestReloadWait [0x12
;   DROPPED]'. ABORTAR (volver a probe): 'DROP FAILED', 'DROP REFUSED', 'DISABLED' en el resumen, un crash en la carga
;   o un DROPPED de una clave que no estaba NOT READY en '[trip N begins]'. Mas de 16 en un viaje solo
;   avisa (WRN 'more than 16'): el anfitrion manda muchos hijos antes que su padre. 0 = nada.
guest_reload_wait_fix=1
; P8 escalada / subidas / desmontar del otro jugador (pendientes/p8-impl-escalada.md). EN LOS DOS PCs.
; remote_climb: PointClimb::Enter 0x691400 de un personaje de jugador remoto (modo de control 2, clave 0xA01...)
;   devuelve 1 si el original falla: sigue la red durante la escalada libre (0 | probe solo cuenta | 1).
; wallup_send: byte exe+0x6D76D5C = 1: este cliente envia UpdateWallUpDataReq 2851 en las subidas a salientes; el
;   servidor ya la reenvia (2893) al otro jugador.
; dismount_probe: sonda de solo lectura (30 ms) del personaje del otro jugador al montar/desmontar (y escalar).
remote_climb=1
wallup_send=1
dismount_probe=1
; divergence_probe (pendientes/p8-impl-log-async.md §3, EN LOS DOS PCs): solo lectura, cada 30 ms, posicion en memoria
;   del personaje del anfitrion frente a la de nuestro canal (la del HUD). > 1,5 m durante > 1 s: una linea por
;   segundo 'RemoteMotion divergence #N [...]' (metodo, acciones, modo de control, bufer mc+0x3D0) y otra al acabar.
divergence_probe=1
; freeze_watchdog (pendientes/p8-impl-freeze-watchdog.md, EN LOS DOS PCs, solo lectura): un hilo del mod mira los
;   fotogramas del bucle principal (ganchos de ui_pause y guest_seq_play; sin ellos, Present); > 300 ms sin fotograma:
;   muestras de la pila de ese hilo ('FreezeWatch #N.k': rip, direcciones de retorno exe+/cdmp+/[stub], gancho del mod
;   en que esta) y una linea 'FreezeWatch #N END' con la duracion. Volver: 0.
freeze_watchdog=1
; P8 movimiento remoto (pendientes/p8-impl-interp-remota.md): remote_interp (retardo de interpolacion por actor 0xB del
;   anfitrion segun su cadencia y umbral de vaciado 2500 ms) tambien en el invitado; horse_follow es solo del anfitrion.
remote_interp=1
horse_follow=0
; P8 cabalgata (pendientes/p8-impl-monturas-cabalgata.md). remote_interp_pair (EN LOS DOS PCs; necesita remote_interp
;   y [sniffer] enabled=1): 0 | 1. El caballo que monta el anfitrion usa el retardo del jinete (el del juego) mientras
;   sus muestras sean densas (horse_follow=1 en el anfitrion); rampa sin saltos al montar y desmontar.
remote_interp_pair=1
; P8 mascotas (pendientes/p8-impl-mascotas.md): remote_interp_owned_cap_ms tambien en el invitado (la mascota y el
;   caballo del anfitrion: tope del retardo y sin contar los huecos en el hombro). child_settle_ms y attach_follow son
;   del anfitrion: aqui no instalan nada (attach_follow=probe solo para que los tres inis digan lo mismo).
remote_interp_owned_cap_ms=900
attach_follow=probe
; P8 sesion 25: flujo de combate (noche/combate-retardo.md 6.2). remote_interp_combat (SOLO INVITADO; necesita
;   remote_interp=1): 0 | probe | 1. Los enemigos del anfitrion en combate (llegadas cada <= 150 ms, o enganchados con
;   ESTE personaje por 2922/2991) usan D = max(3 ultimos huecos de llegada) + 80 ms, entre 120 y 400, y bajan 1 ms por
;   ms (las mascotas/caballos con dueno y el caballo montado, nunca). probe: se calcula en paralelo y se cuenta (linea
;   'RemoteInterp summary combat'), no se aplica. Primera sesion de dos PCs: probe (anfitrion combat_follow_v2=probe);
;   despues 1 en los dos. Volver: 0.
remote_interp_combat=1
; P8 sesion 9 (pendientes/p8-impl-s9-movimiento.md). ride_filter: aqui actua en guest_deliver sobre las acciones del
;   personaje del anfitrion (1: sustituye montar/desmontar; los pares de hashes se apuntan igual). child_reannounce: si el cliente no puede crear la
;   mascota del anfitrion, la pide de nuevo por el tunel. combat_follow y guest_horse_probe son del anfitrion.
ride_filter=1
; P8 monturas (pendientes/p8-impl-monturas.md). mount_sync (EN LOS DOS PCs): 0 | probe | 1.
;   probe: sondas de la etapa 1 (vf53 0x2228260 y su thunk 0xA45740, RideOff 0x2228E40, vf54 0xA45760, RideOn/
;   RideOff::Enter, 2663/2916, StartActionAck 0xB57720) y los eventos MountBegin/MountCommit/MountDetach del
;   personaje PROPIO por el tunel (control 5); el otro PC apunta lo que haria (args exactos), sin retener, llamar
;   ni escribir nada. 1: ademas el observador retiene el flujo hasta el Commit (<= 500 ms), reproduce 0x2228260
;   en el hilo principal antes de la accion de montar, comprueba las postcondiciones y deja pasar la accion
;   original (ride_filter se aplaza solo para esa transaccion). Sesion 17 (sondas): orden, argumentos (asiento 0,
;   quinto 0) y juicio 'apply' en las 8 monturas; el desmontaje de un jugador no pasa por 0x2228E40: el controlador
;   vigila ahora su propio vinculo y publica un Detach 'observado' (bandera 12, p4 0; sale tambien en probe).
;   SESION 18-19: probe en el invitado y 1 en el anfitrion (S19: el jinete del invitado visto en el anfitrion monta y
;   desmonta con vinculo nativo, arreglo B 5/5, 0 fallos).
;   FASE B (pendientes/p8-impl-monturas.md 12): mount_sync=1 TAMBIEN AQUI. El invitado observa al jinete del
;   ANFITRION: vinculo nativo al montar (0x2228260 en el despacho de su 2991), RideOff nativo al desmontar y el desvio
;   de la puerta 0x2329A90 (arreglo B) para salir de el. Que mirar y cuando abortar: seccion 12 del documento.
;   RETROCESO (en este orden, conservando cdmp.log y cdmp_packets de los dos PCs):
;     1) ride_dismount=partial  (sin desvio de la puerta: solo se reescriben las acciones 0x40 del desmontaje);
;     2) ride_dismount=rewrite  (S17: todo el desmontaje reescrito; el vinculo se retira en el primer paso a pie);
;     3) mount_sync=probe       (sin vinculo en este PC: como las sesiones 17-19).
;   APAGAR: mount_sync=0 (todo como antes). Plan B sin cambios: cdmp.p8-s12-shadow-seguro.ini (probe / rewrite).
mount_sync=1
; P8 SESION 18-20, ride_dismount (pendientes/p8-impl-monturas.md 11 y 12): rewrite | partial | native. EN EL INVITADO
;   native desde la fase B (solo vale con mount_sync=1; con probe el desvio no se instala y todo se reescribe como
;   rewrite). Retroceso: partial y luego rewrite (arriba).
ride_dismount=native
; P8 SESION 21 (pendientes/p8-impl-monturas.md 13), EN LOS DOS PCs, solo con mount_sync=1: 0 | probe | 1.
;   mount_seat: sentar al jinete remoto en la silla con vf54 0xA45760 tras el vf53 del observador (tipo de enganche 4,
;     el hueso de la silla de ESTE cliente; sin esto se coloca con sus propias muestras de red y se separa hasta 1,4 m).
;     Si sigue sentado 1,5 s despues del desmontaje, una retirada 0x2228E40 (bandera 12). Retroceso: probe, luego 0.
;   ride_hold_pos: no aplicar la pose vacia al montar (tras RideOn::Enter el bufer queda vacio y 0x88E6A0 devolvia
;     (0,0,0): el parpadeo); se rellena con la pose actual del jinete remoto. Retroceso: probe (solo cuenta), luego 0.
; P8 SESION 22: el tipo 9 es "sin enganche" (S21 lo rechazaba como ocupado y nunca sento al jinete). Sentado,
;   el arranque de RideOn sale de su pose (no del origen) y el juego deja de aplicarle las muestras de red.
;   ride_hold_pos en probe: la salida de 0x88E6A0 ya llevaba la pose actual (la premisa de S21 era falsa).
mount_seat=1
ride_hold_pos=probe
; P8 SESION 26 (docs/research/s25/montura-regresion.md 7.2 y 10), EN LOS DOS PCs, solo con mount_sync=1: 0 | probe | 1.
;   mount_relink: si el juego retira el vinculo que este PC acaba de aplicar antes del RideOn del jinete remoto (una
;   accion previa a montar con su caballo de objetivo, S26 paso 2), se vuelve a aplicar (vf53 + vf54) en su siguiente
;   accion previa (padre -1, objetivo el caballo). probe: solo la linea 'MountSync RELINK (probe: would relink)' una vez
;   por montura, sin llamar a nada. Un fallo solo afecta a esa montura. Apagado sin los ganchos RideOn/RideOff::Enter.
mount_relink=probe
child_reannounce=1
; P8 S1 opcion A, tramo de SECUENCIADORES (pendientes/p8-impl-opcion-a.md). SOLO INVITADO; 0 | probe | 1.
; guest_seq_route: un 2661/2981/2810/2322 que nombra a OTRO personaje (el Kliff del anfitrion) va al gestor de escenas
;   de ESE personaje (X) y no al del dueno del campo (M, el propio). Comparte direccion con guest_stage_diag y con
;   P8Probe (load_diag): sus lineas muestran ya el gestor usado. Lineas 'GuestSeqRoute [...]'. Sin esta clave a 1 las
;   copias del anfitrion se descartan antes del cliente ('GuestSeqRoute [gate]').
; guest_seq_watch: claves de actor (hex) cuyo estado se escribe al cambiar (G5): existencia, +0x5E, +0xC2/+0xCF y
;   componente de secuenciador (+0x2D8/+0x2E0; desde guest_seq_play tambien +0x3D8, +0x320 y el padre +0xAC). Los
;   actores de cada 2661 enrutado se vigilan solos. Claves de la SESION 9 (p8-s9-npc.md §0; cambian entre sesiones):
;   Rhett B0100156, Turnali B0100BE6, Tina B0100BE8, posadero B0100A49, Grover B0100A4F, Dahlia B0100A50, y la mesa del
;   posadero (secuenciador 0x1A4): Pedro B0100A47, mesa B0100A48, Freesword B0100A4A (para ver si se sientan).
; guest_seq_route_deny (pendientes/p8-impl-escenas-play.md §15): recursos (hex) de escenas del anfitrion que NUNCA van a X:
;   su 2661 no se crea en ningun gestor (como antes de la opcion A) y sus 2981/2524 se quedan en M (sin efecto). Sesion 9:
;   la cinematica de liberar el campamento (secuenciador 0x213, recurso 0x8CD771B1) recargo el campo de ESTE cliente y el
;   servidor lo saco al titulo. Ampliar con el recurso de cada linea 'GuestSeqRoute [2981 state N into X]' que preceda a
;   una carga o a un cambio de camara/control. Vacio = sin lista (no recomendado).
guest_seq_route=1
guest_seq_watch=B0100156,B0100BE6,B0100BE8,B0100A49,B0100A4F,B0100A50,B0100A47,B0100A48,B0100A4A
guest_seq_route_deny=8CD771B1
; P8 REPRODUCCION de las escenas copiadas (pendientes/p8-impl-escenas-play.md). SOLO INVITADO. Necesita guest_seq_route=1.
; guest_seq_play (0 | probe | 1): en cada fotograma (gancho 0x8B6144, hilo principal, justo antes del tick nativo de M)
;   llama a 0xA953C0(X, Q, modo) para el gestor X del Kliff del anfitrion, y UNA vez por cada 2322 enrutado escribe
;   X+0x231 = 3 (X en 2, +0x174 = 0, M+0x231 = 3, algo en +0x1B0/+0x1C0). probe: decide y cuenta, no llama ni escribe.
; guest_seq_play_live (0 | 1, necesita guest_seq_play): ademas 0xAA3E70(X, dt) (vida de las escenas: ramas, esperas,
;   enganche de NPC) cuando X esta en 3, y el 2524 enrutado a X (quinto punto de guest_seq_route, 0xC08178).
; Lineas: 'GuestSeqPlay [state|first tick|3|vf40]', 'GuestSeqPlay summary' cada 60 s, 'GuestSeqRoute [G5 X]' cada 30 s.
; El anfitrion debe llevar el cdmp.asi de este cambio: su filtro descarta los 2276/2105 del invitado sobre sus escenas.
; PRUEBA SIGUIENTE = SOLO FASE 1 (tick 0xA953C0 + el 3): guest_seq_play_live=0. 0xAA3E70 no es pasiva: tras las escenas
;   vivas consulta al jugador LOCAL (0x8B4570 -> 0xA96070/0xA9A1F0/0xA9A410) y acaba en 0xAA5040 (puede escribir 1.0 en
;   [[World+0xA8]+0x208]) y 0xAA5400 (_chapterTransition). La guarda ya esta (gancho 0xAA4B27 -> 0xAA4CB2 solo para
;   nuestra llamada, y compuerta de lectura de X+0x2A4/+0x288/+0x2D4/+0x2CC y +0x2A8 solo con su temporizador +0x2B0
;   >= 0: p8-impl-escenas-play.md §13.3 y §15), pero
;   la fase 2 es el SEGUNDO paso de la sesion: cdmp.p8-s7-shadow-fase2.ini (igual que este con guest_seq_play_live=1).
; APAGAR (criterio de aborto: camara o control del invitado raros, cierre): guest_seq_play=0 (todo como antes: X queda
;   en 2, nada se reproduce). Volver a medir sin tocar el juego: guest_seq_play=probe.
guest_seq_play=1
guest_seq_play_live=0
; P8 SESION 9: VETO de lo que una escena de X (el Kliff del anfitrion) haria a ESTE cliente (pendientes/p8-s9-cinematica.md
;   §8). SOLO INVITADO; necesita guest_seq_route=1. En la sesion 9 la cinematica del campamento liberado, enrutada a X,
;   ejecuto su funcion de etapa Loading en el invitado: recarga propia (0x778AB0 -> [P+0x15C]=1), GameLoadingStartReq,
;   2679 del servidor y vuelta al titulo.
; guest_x_stage_veto (0 | probe | 1): V1 = gancho 0x5F2A3A (Loading, tras su compuerta 0x204F730): si el gestor de la
;   etapa ([proc+8]) es de OTRO personaje (en la tabla de X o por clave), AL=0 y el manejador sale por su camino nativo
;   de "compuerta rechaza". V0 = 0x778AB0: SOLO CUENTA (revision: ni P ni la peticion dicen de quien es la etapa)
;   las peticiones de carga dentro del "contexto X" (2981 enrutado 0xC07749..0xC07776 y nuestras 0xA953C0(X)/0xAA3E70(X)).
; guest_x_camera_veto (0 | probe | 1): cuenta, por manejador (FadeInOut, LetterBox, SequencerCamera, ...), lo que se
;   vetaria; '1' actua como probe hasta leer cada manejador entero.
; Lineas: 'GuestXVeto [Loading] ... VETOED', 'GuestXVeto [0x778AB0] ... SKIPPED', 'GuestXVeto [camera] ... WOULD VETO'
;   y 'GuestXVeto summary' cada 60 s. ABORTAR: cierre o carga colgada del invitado tras una cinematica del anfitrion,
