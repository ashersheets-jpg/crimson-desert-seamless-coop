; cdmp.ini - rama opcion-d, P8: escenas propias del usuario 2 y efecto secundario de observer_hold, en UN PC: anfitrion
; con cdmp_peer (usuario 2 sin cliente real). Documento: docs/research/pendientes/p8-escenas-y-acks.md §5.
; = cdmp.p8-2322-local.ini + observer_scene_copy=1 + observer_hold_acks=1. Control: las dos a 0.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
observer_hold=1
load_diag=1
observer_stage_sync=1
observer_milestone=1
observer_milestone_send=1
observer_scene_copy=1
observer_hold_acks=1
