; cdmp.ini - rama opcion-d, P8 en el ANFITRION con S1/S2/S3: como cdmp.p8-host.ini + observer_hold + sondas load_diag/s1_diag.
; Todo lo de 2026-10-09 activo (C4/C4r, reloj, identidad F002, D-52/D-53) + sonda de companeros (solo lectura).
; Escribe en el juego: guardian de guardado (no se puede guardar) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
; imprescindible: sin el, un reinicio de Shadow mata el tunel hasta reiniciar el juego
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
; solo lectura: cuenta 2042 y registra la creacion de companeros
companion_probe=1
; S3 (docs/research/pendientes/p8-impl-s3.md), apagado por defecto. Para probarlo, quitar el ';' de la linea
; siguiente: los NPC que controla un usuario (+0x90) y llegan con restauracion 0 se publican solo a su controlador
; hasta su primera accion; al otro usuario le llega despues un 2005 nativo nuevo (lineas 'Session2 observer hold').
observer_hold=1
; P8 S1/S2, solo lectura (docs/research/pendientes/p8-impl-s1s2.md). Para la sesion de Shadow con
; cdmp.p8-shadow-s12.ini quita el ';' de las dos: rama de dueno 0x2BC8470, ruta del 2322 0x287F1CC y eventos
; de la UI ExtraReward 0xE919C0 (load_diag); busqueda de acciones y graficos BodyAnimation (s1_diag).
load_diag=1
s1_diag=1
observer_stage_sync=1
