; cdmp.ini - rama opcion-d, P8 S2 / 2322 del observador, ANFITRION, TRAMO A (MEDIDA).
; Documento: docs/research/pendientes/p8-2322-observador.md. Mismo cdmp.asi en los dos tramos y en Shadow.
; = cdmp.p8-host-full.ini + observer_milestone=1 (decide y registra, NO llama a nada) + buferes de Steam explicitos.
; El tramo B (cdmp.p8-2322-host-B.ini) solo cambia observer_milestone_send=0 -> 1.
; Escribe en el juego: guardian de guardado (no se puede guardar) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en A y en B (y en Shadow)
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del cliente propio del anfitrion (cdmp_packets_*.bin en bin64): imprescindible para el cruce
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
companion_probe=1
; S3 (retencion de publicacion): igual en A y en B
observer_hold=1
; S2/S1 solo lectura: sondas de la rama de dueno 0x2BC8470, ruta 0x287F1CC, UI ExtraReward (load_diag) y S1 (s1_diag)
load_diag=1
s1_diag=1
; libro de escenas/secuenciadores (solo medida; =2 NUNCA envia nada)
observer_stage_sync=1
; P8 S2: sigue los viajes del usuario 2 (2174 -> 2144 -> 3066 -> entrada 0x2BC84E2) y DECIDE sin emitir:
; lineas 'ObserverMilestone [decision] ... WOULD EMIT' o '... NO 2322 FROM US: <motivo>'
observer_milestone=1
observer_milestone_send=0
