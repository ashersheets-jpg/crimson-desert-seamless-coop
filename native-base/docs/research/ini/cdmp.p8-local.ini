; cdmp.ini - rama opcion-d, prueba en UN PC (peer) de las piezas P8: C4r + reloj + C2 + D-53 + observer_hold (S3) + sondas S1/S2 del anfitrion.
[general]
player_name=Player

[net]
; cdmp_peer --mode replay se conecta aqui (127.0.0.1:37015) y hace el login del usuario 2
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
save_guard=1
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
identity_fix=1
child_hold=1
observer_hold=1
load_diag=1
s1_diag=1
observer_stage_sync=1
