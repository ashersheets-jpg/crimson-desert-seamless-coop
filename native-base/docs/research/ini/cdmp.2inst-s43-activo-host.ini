npc_activation=1
; S36 fase B (docs/research/s25/s36-fase-b.md; AUDITORIA.md §2, §6, §8.3): familias NPC. PASO 1 = probe: mide
;   (censo por raiz completa/partida/pendiente, lo que asignaria, reservas que fallarian, tardios, lecturas
;   desconocidas) y NO cambia ningun controlador: U-e sigue como en la fase A.
;   npc_family_control: 0 | probe | 1. 1 = una raiz con hijos solo se asigna si su unidad ENTERA (raiz + subarbol
;     de descriptores +0x2F0/+0x2F8) se reserva antes de EAX; sus miembros de la cohorte nacen con el usuario 2 y
;     los tipo 7 con el anfitrion (host-kept). 1 necesita user2_stages=1, user2_npc_control=1, npc_activation=1,
;     npc_action_evidence=1, npc_degradation=1 y publication_gate=1 (si falta alguno queda en probe con un WRN).
;   npc_family_types: la cohorte de MIEMBROS (3, 6, 7). Por defecto 3,6; 7 solo explicito (no en este kit).
npc_family_control=1
npc_family_types=3,6
user2_road_control=1
; S40 carros (docs/research/s25/s40-carros.md): user2_road_carts = 0 | probe | 1 (con user2_road_control=1).
;   0: raices tipo 5 (caballo con jinete, carro) fuera del modo 1 (con el anfitrion, quietas lejos de el).
;   probe: su unidad entera se mide como 'se asignaria' sin escribir ningun controlador.
;   1: se asignan enteras al invitado (raiz + jinete/conductor + vehiculo enlazado); gimmicks tipo 7 y su carga con el
;     anfitrion; nunca un vehiculo que monta un jugador. APAGAR: user2_road_carts=0 (o probe).
user2_road_carts=1
user2_fast_rearm=1
; S35 fase A (docs/research/s25/s35-fase-a.md). Paso 2: las cuatro activas (1).
;   npc_action_evidence: 0 = emisor S34 (param4 mal leido) | probe = criterio H1b solo registrado | 1 = decide H1b
;     (accion nativa autorizada y APLICADA por el controlador de la unidad; rama payload+0x281 = activacion).
;   npc_containment_guard: 0 | probe | 1. 1 = no retira por silencio/carga del invitado, una Req pospone hasta
;     plazo + gracia (acotado), y la retirada se revalida al EJECUTARSE (version de la unidad).
;   npc_degradation: 0 | probe | 1. 1 = con npc_activation=1 una contencion no lista NO rearma el aborto global de 5 s
;     (U-e deja de asignar NPC nuevos mientras dure).
;   publication_gate: 0 | probe | 1. 1 = ninguna salida de observer_hold / observer_hold_family publica a quien no lo
;     controla un actor con estado incompleto (restore 0, CC ilegible, padre retenido o incompleto); tablas llenas:
;     retenido sin entrada. Retencion acotada por publication_retain_max_ms y despues se suelta SIN publicar.
;   Plazos experimentales (ms), no leyes del motor: npc_no_progress_ms (5000 = S34), npc_req_grace_ms,
;     npc_guest_silence_ms, npc_postpone_max_ms (tope de la posposicion por silencio/carga), publication_retain_max_ms.
npc_action_evidence=1
npc_containment_guard=1
npc_degradation=1
publication_gate=1
npc_no_progress_ms=8000
npc_req_grace_ms=8000
npc_guest_silence_ms=2000
npc_postpone_max_ms=60000
publication_retain_max_ms=60000
enabled=1
probe=1
; P8 sesion 24: guardado desviado (pendientes/p8-guardado-desviado.md). Al arrancar se copia la carpeta save ENTERA a
;   %LOCALAPPDATA%\Pearl Abyss\CD\cdmp_save_sandbox (la copia anterior pasa a cdmp_save_sandbox_prev) y TODO lo que el juego
;   hace bajo save (guardar, cargar, listar; tambien el usuario 2 del servidor) va a esa copia: guarda sin el aviso
;   'Failed to save data' y la carpeta save real no se escribe. Si la copia falla, vuelve solo a 1 (bloqueo). PLAN B: 1.
save_guard=redirect
; S35 fase E (s25/s35-fase-e-guardado.md): exporta la caja anterior, verificada, antes de rehacerla; nunca escribe la carpeta real
host_save=probe
host_save_dir=C:\Emulador CD\backups\host_save_exports
host_save_keep=20
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
