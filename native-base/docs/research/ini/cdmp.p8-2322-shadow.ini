; cdmp.ini - rama opcion-d, P8 S2 / 2322 del observador, SHADOW (invitado real), TRAMOS A y B: este MISMO archivo en los dos.
; Documento: docs/research/pendientes/p8-2322-observador.md. Mismo cdmp.asi que el anfitrion.
; La emision es solo del anfitrion: en Shadow no cambia nada entre A y B.
; = cdmp.p8-shadow-full.ini (S3, contenciones, sondas S1/S2, guest_stage_diag) + buferes de Steam explicitos.
; load_diag=1 trae tambien las lineas 'GuestLoad' (2174/2549/2144/3066/2322/2445/2762 y resumen por viaje);
; guest_actor_diag=1 les da los estados de carga (sin el, el resumen dice 'loading states not observed').
; crashpad_handler.exe sigue fuera de bin64 (K2).
[general]
player_name=Shadow

[net]
enabled=1
transport=steam
role=guest

[steam]
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en A y en B (y en el anfitrion)
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del invitado (cdmp_packets_*.bin): imprescindible para el cruce con el anfitrion
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
guest=1
guest_mode=remote
guest_actor_diag=1
guest_layer_guard=1
guest_s3_diag=1
guest_crash_dump=1
guest_update_guard=1
load_diag=1
s1_diag=1
guest_stage_diag=1
; P8 pausa del ESC (pendientes/p8-pausa-esc.md, "Implementado", T3): mientras este invitado juega en el
; anfitrion, sus menus (ESC, mapa, inventario...) NO pausan su mundo. T3 se hace primero SIN esta linea en
; Shadow (solo el anfitrion) y despues con ella. Para activarla quitar el ';':
;ui_pause_block=1
; P8 S1 escenas de NPC, SOLO MEDIDA (pendientes/p8-s1-escenas-npc.md, "Implementado para la medida"): G1 bloque de IA
; de cada NPC, G2 replica de lectura del contenedor NPCScheduleManager, G3 el gestor X del Kliff del anfitrion, G4
; C>S de escena del invitado. Apagado aqui; encendido en cdmp.p8-s1-shadow.ini.
;guest_scene_diag=1
