; cdmp.ini - rama opcion-d, P8 SESION 7 en el ANFITRION: todo lo de la noche del 10-10 (2322, escenas propias, acks de NPC,
; character_hold, tunel comprimido, menus sin pausa con invitado) + sondas de medida S1 (solo lectura).
; Documento: docs/research/pendientes/p8-s1-escenas-npc.md, seccion "Implementado para la medida". Mismo cdmp.asi en
; el anfitrion y en Shadow (cdmp.p8-s1-shadow.ini).
; = cdmp.p8-2322-host-B.ini con UNA sola diferencia: s1_scene_diag=1 (sondas H1-H3, solo lectura: no escribe en el
; juego, no llama a funciones del juego, no envia ni retiene nada). Volver a B: s1_scene_diag=0.
; Lineas nuevas en cdmp.log: 'SceneDiag [...]' (H1 bandera 0x2A78D0D y reenvio 0x2A79060; H2 bloque de IA, vf13 y
; reenlace 0x20853D0/0x9F2FA0 del cliente propio; H3 libro de escenas de la sesion 1, viajes del usuario 2 y 2005 de
; NPC encolados a la sesion 2) y resumenes 'SceneDiag [H1|H2|H3 summary]' cada 60 s.
; Escribe en el juego: guardian de guardado (sesion 24: guardado desviado a cdmp_save_sandbox, la carpeta save real no se escribe) y K1. K2: crashpad_handler.exe apartado.
[general]
player_name=Host

[net]
enabled=1
transport=steam
role=host

[steam]
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en el anfitrion y en Shadow
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del cliente propio del anfitrion (cdmp_packets_*.bin en bin64): imprescindible para el cruce y, con
; s1_scene_diag=1, la fuente del libro de escenas (2335/2126/2411/2661/2810/2874 hacia la sesion 1)
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
; P8 sesion 24: guardado desviado (pendientes/p8-guardado-desviado.md). Al arrancar se copia la carpeta save ENTERA a
;   %LOCALAPPDATA%\Pearl Abyss\CD\cdmp_save_sandbox (la copia anterior pasa a cdmp_save_sandbox_prev) y TODO lo que el juego
;   hace bajo save (guardar, cargar, listar; tambien el usuario 2 del servidor) va a esa copia: guarda sin el aviso
;   'Failed to save data' y la carpeta save real no se escribe. Si la copia falla, vuelve solo a 1 (bloqueo). PLAN B: 1.
save_guard=redirect
create_session=1
accept_tunnel=1
share_field=1
relay_fix=1
reconnect=1
clock_gate=1
; P8 sesion 25: hora y clima (research/noche/clima-hora.md, seccion "Implementado"). SOLO ANFITRION salvo clock_probe.
;   user2_clock_push: 0 | probe | 1 (necesita clock_gate=1). T1: justo detras de cada LoadingCompleteAck 2762 del usuario 2,
;   un SetFieldTimeAck 2816 nativo con el reloj del mundo del servidor (exe+0x6A6D238, dos lecturas iguales: base y ancla);
;   T2: el mismo 2816 cuando ese reloj cambia con el usuario 2 en el mundo (asentado 1 s, nunca durante sus cargas).
;   probe = solo lineas 'Session2 clock push [probe] T1|T2 ... WOULD queue', no envia nada. Activar: 1.
;   block_guest_weather: 1 = el SyncWeatherStateReq 2560 del usuario 2 no llega al servidor (escribiria los flags de clima
;   del campo del anfitrion sin comprobar el dueno); contado ('guest weather Req 2560 dropped' en el informe). Volver: 0.
;   clock_probe: 1 = linea 'ClockProbe [host]' cada 5 s, SOLO LECTURA, para compararla con la del invitado. Apagar: 0.
user2_clock_push=1
block_guest_weather=1
clock_probe=1
; P8 sesion 25: clima del anfitrion en el invitado (modo visor; research/noche/clima-sincronizar.md, "Implementado").
;   weather_sync: 0 | probe | selftest | 1, en LOS DOS PC. probe = SOLO LECTURA: linea 'WeatherSync [probe host]' cada
;   5 s (X por los dos caminos, X+0x31, holder A/B/C, X+0x88, el vector con nombres, X+0x124/+0x128, tick % 60000),
;   'X CHANGED' al momento si X o sus bloques cambian y 'target changed' con tick % 60000. selftest = solo un PC
;   (cdmp.p8-clima-selftest.ini). 1 = el anfitrion manda su vector (estado 12) a un invitado con caps 0x04. Apagar: 0.
weather_sync=probe
identity_fix=1
; P8 sesion 25: partida propia del invitado, fase A (noche/progreso-invitado.md, "Implementado (fase A)"). SOLO
;   ANFITRION; 0 | probe | 1. Necesita save_guard=redirect sano (si no, se apaga solo con una linea). probe = solo
;   sondas de LoadSlot 0x186F570, SavePlayerToSlot 0x186E450 y FlushPendingSaveData 0x1871930 (quien llama, usuario,
;   ranura, resultado, hilo): no cambia nada. 1 = el usuario 2 carga y guarda SU ranura 204 de la caja (no la 207:
;   GetOrCreateSlot la deja solo en memoria); si no esta lista se rechaza (nunca la del anfitrion). En esta prueba de
;   dos PC aun no hay subida por el tunel (fase B): con probe se ve el flujo real del invitado de Shadow.
;   P8 sesion 25, fase B ("Implementado (fase B)"): con probe el anfitrion ACEPTA la subida del invitado (estados 6-11
;   del tunel), la comprueba (SHA-256, cabecera) y la deja preparada, pero el usuario 2 sigue jugando el clon y no se
;   devuelve nada (SAVE_STATUS modo probe). Lineas 'Session2 guest save link:'. Con 1: carga y guarda la del invitado.
guest_own_save=probe
child_hold=1
companion_probe=1
; S3 (retencion de publicacion): igual que en B
observer_hold=1
; P8 sesion 14 (pendientes/p8-impl-spawn-action.md): los NPC del anfitrion anunciados al usuario 2 MIENTRAS CARGA
; (la instantanea del campo, S13: 531 antes de su 2144) se le retienen aunque tengan restauracion 1 y se le anuncian
; de forma nativa tras su 2762 (como los "vivos"). 0 = como en S13; probe = solo cuenta/lineas
observer_load_defer=1
; P8 S15/S16 (pendientes/p8-s14-viajeros.md s7; antes observer_hold_pieces, que queda como alias): el usuario 2 nunca
; recibe un registro de actor (2005) antes que el de su padre (+0xAC): piezas, miembros con CC y jinetes esperan a un
; padre retenido o que aun no le llego y salen justo detras de el. Valvula: si demasiados esperan en vano, la regla
; "aun no anunciado" se apaga sola. probe = solo cuenta/lineas. El recuento de huerfanos enviados va siempre (obs_hold=1)
observer_hold_family=1
; S2/S1 solo lectura: sondas de la rama de dueno 0x2BC8470, ruta 0x287F1CC, UI ExtraReward (load_diag) y S1 (s1_diag)
load_diag=1
s1_diag=1
; libro de escenas/secuenciadores (solo medida; =2 NUNCA envia nada); su hilo formatea tambien las lineas SceneDiag
observer_stage_sync=1
; P8 S2: igual que en B (emite el 2322 nativo, una vez por viaje)
observer_milestone=1
observer_milestone_send=1
; P8 S1 escenas de NPC, SOLO MEDIDA (pendientes/p8-s1-escenas-npc.md, "Implementado para la medida"): H1 bandera
; 0x2D3 del StartActionReq en el servidor, H2 enlace de los NPC de escena en el cliente propio, H3 libro de escenas y
; posicion del primer 2005 de NPC de cada viaje del usuario 2.
s1_scene_diag=1
observer_scene_copy=1
observer_hold_acks=1
character_hold=1
; P8 revision de la noche (I3, pendientes/p8-revision-noche.md): la regla de hilos de NotifyAppear ya tiene clave propia,
; 0 por defecto (D-53 como antes). =1 para medirla como en la regresion de la noche.
notify_thread_rule=0
tunnel_compress=1
ui_pause_block=1
; P8 juego del usuario 2 (pendientes/p8-impl-rango-embudos.md). SOLO ANFITRION; 0 | probe (solo cuenta) | 1.
; rank_permit: en el cliente del anfitrion, vf188(5) del Kliff del usuario 2 responde 1 en 0x221E281/0x221F29F: los
;   enemigos le dan permiso de rango (ataques normales). La F5 (aggro_test) sigue como estaba.
; quest_per_user: dentro de una Req del usuario 2, ServerField::vf40 devuelve SU gestor de misiones (zonas, seguimiento,
;   filtro de reaparicion), no el del anfitrion.
; kill_loot_per_user: dentro de una Req del usuario 2, DeadActor 0x62 (contadores de mision/campamento) y el destinatario
;   del botin del cadaver van al usuario 2. Probar misiones SOLO con una partida desechable del anfitrion.
rank_permit=1
quest_per_user=1
kill_loot_per_user=1
; P8 SESION 15, VIAJE RAPIDO del usuario 2 (pendientes/p8-impl-viaje-rapido.md). SOLO ANFITRION; 0 | probe | 1.
;   1 = F3: dentro del ReloadStageStartReq 2283 del usuario 2, la vf48 que vuelve a 0x2A5F7FC da SU gestor de
;   secuenciadores (no el del anfitrion): el destino va a SU TransformSync+0x550; su 2437 recibe 2643 + 3066 (0x2BCA3D0).
;   0 / probe (o F3 sin instalar) = F2: el 2283 del usuario 2 se DESCARTA antes del servidor (el +0x550 del Kliff del
;   anfitrion nunca se toca; el invitado sale al titulo salvo que lleve guest_fast_travel_veto=1). Apagar F3: 0.
user2_fast_travel=1
; P8 S15 (pendientes/p8-impl-viaje-rapido.md seccion 11). SOLO ANFITRION. user2_loading_owner_alias: 1 (por defecto) =
;   la copia del usuario 2 del LoadingFieldDataAck 2643 nombra al usuario 2 como dueno del campo (u32 +9), como el 2174.
;   user2_travel_probe: 1 = lineas de solo lectura TravelBegin/Context/Prepared/Consume/Ack alrededor del 2283/2437
;   del usuario 2 (sin ganchos nuevos; las del servidor necesitan user2_fast_travel=1). 0 = sin lineas.
user2_loading_owner_alias=1
user2_travel_probe=1
; P8 S16 (pendientes/p8-impl-viaje-rapido.md seccion 12). SOLO ANFITRION; 0 | probe | 1. Recarga del usuario 2 en el
;   campo compartido (su 2283 aceptado por F3 -> 2437 -> 2643/3066, sin 2174): 1 = su PreLoadSequencerReq 2873 se
;   DESCARTA (los secuenciadores del anfitrion no se vuelven a preparar) y se emite UN 2322 para SU personaje en la
;   salida de su siguiente ExecuteTroc (>= 300 ms), con el emisor verificado de observer_milestone (necesita
;   observer_milestone_send=1 y user2_fast_travel=1). probe = el 2873 sigue al servidor y solo se registra la decision.
observer_milestone_reload=1
; P8 escalada / subidas / desmontar del otro jugador (pendientes/p8-impl-escalada.md). EN LOS DOS PCs.
; remote_climb: PointClimb::Enter 0x691400 de un personaje de jugador remoto (modo de control 2, clave 0xA01...)
;   devuelve 1 si el original falla: sigue la red durante la escalada libre (0 | probe solo cuenta | 1).
; wallup_send: byte exe+0x6D76D5C = 1: este cliente envia UpdateWallUpDataReq 2851 en las subidas a salientes; el
;   servidor ya la reenvia (2893) al otro jugador.
; dismount_probe: sonda de solo lectura (30 ms) del personaje del otro jugador al montar/desmontar (y escalar).
remote_climb=1
wallup_send=1
dismount_probe=1
; divergence_probe (pendientes/p8-impl-log-async.md §3, EN LOS DOS PCs): solo lectura, cada 30 ms, posicion en memoria
;   del personaje del otro jugador frente a la de nuestro canal (la del HUD). > 1,5 m durante > 1 s: una linea por
;   segundo 'RemoteMotion divergence #N [...]' (metodo, acciones, modo de control, bufer mc+0x3D0) y otra al acabar.
divergence_probe=1
; freeze_watchdog (pendientes/p8-impl-freeze-watchdog.md, EN LOS DOS PCs, solo lectura): un hilo del mod mira los
;   fotogramas del bucle principal (gancho de ui_pause; sin el, Present); > 300 ms sin fotograma: muestras de la pila de
;   ese hilo ('FreezeWatch #N.k': rip, direcciones de retorno exe+/cdmp+/[stub], gancho del mod en que esta) y una
;   linea 'FreezeWatch #N END' con la duracion. Volver: 0.
freeze_watchdog=1
; P8 movimiento remoto (pendientes/p8-impl-interp-remota.md); 0 | probe (solo mide) | 1.
; remote_interp (ANFITRION e INVITADO): retardo de interpolacion propio para cada actor 0xB remoto (NPC, animales,
;   mascota y caballo del otro) segun su cadencia, y umbral de vaciado del bufer 1000 -> 2500 ms. Los 0xA no cambian.
; horse_follow (SOLO ANFITRION): cada MoveActorAck de un jinete hacia el usuario 2 va seguido de uno sintetico de su
;   caballo (la posicion del Path del jinete). El sentido contrario (el invitado monta) solo se mide.
remote_interp=1
horse_follow=1
; P8 cabalgata (pendientes/p8-impl-monturas-cabalgata.md).
; horse_follow_reverse (SOLO ANFITRION; necesita [sniffer] enabled=1 y child_hold): 0 | probe | 1. Cuando el jinete del
;   invitado va en SU caballo (dueno = usuario 2), cada MoveActorAck del jinete que llega a ESTE cliente va precedido de
;   uno del caballo (pose del Path del jinete, su mismo tick), solo si es mas nuevo que la ultima muestra del caballo.
;   Solo presentacion en este cliente: nunca va al servidor ni al invitado. Lineas 'HorseFollowReverse' en el resumen.
; remote_interp_pair (EN LOS DOS PCs; necesita remote_interp y [sniffer] enabled=1): 0 | 1. El caballo que monta un
;   jugador usa el retardo del jinete (el del juego) mientras sus muestras sean densas; rampa sin saltos al montar y
;   desmontar. Lineas 'RemoteInterp summary pairs'.
horse_follow_reverse=1
remote_interp_pair=1
; P8 mascotas (pendientes/p8-s8-mascotas.md, p8-impl-mascotas.md); todas 0 por defecto.
; child_settle_ms (SOLO ANFITRION): un hijo de usuario (mascota/caballo/companero, tipo 4/5/6, cualquier byte de
;   restauracion) no va en el mismo 2005 que el personaje de su dueno hacia el otro usuario (ni menos de N ms
;   despues): se retiene y se re-anuncia de forma nativa N ms despues del personaje. Arregla la mascota del
;   anfitrion que nunca aparece en el invitado (error de creacion del actor desde exe+0x8BDF7C, 7 de 7 sesiones).
; remote_interp_owned_cap_ms (EN LOS DOS PCs, necesita remote_interp): tope del retardo de los actores con dueno
;   (mascota, caballo) y sin contar sus huecos mientras van en el hombro.
; attach_follow (SOLO ANFITRION): 0 | probe (mide la hipotesis del Path local, no envia nada) | 1 (Move sinteticos
;   de la mascota del anfitrion en el hombro hacia el invitado). La mascota del invitado solo se mide.
;   Sesion 9: con 1500 la mascota del anfitrion fallo igual (18 ms despues); las buenas iban de 2,8 a 4,3 s -> 4000.
child_settle_ms=4000
remote_interp_owned_cap_ms=900
attach_follow=probe
; P8 sesion 9 (pendientes/p8-s9-combate-montura.md, p8-impl-s9-movimiento.md); todas 0 por defecto.
; ride_filter (EN LOS DOS PCs; aqui necesita [sniffer] enabled=1): 0 | probe (cuenta y apunta los hashes alrededor de
;   montar/desmontar, no cambia nada) | 1 (la accion de montar/desmontar del OTRO jugador se convierte en la nativa de
;   a pie / montado: nunca entra en RideOn/RideOff, que lo congelaban). Sesion 10: 1 (las sustituciones son byte a byte las nativas; las variantes que no esten en la lista siguen como hoy y sus pares se apuntan igual).
; child_reannounce (EN LOS DOS PCs): 0 | probe | 1. Si el cliente del invitado no puede crear un hijo del anfitrion
;   (error desde exe+0x8BDF7C), pide por el tunel que se re-anuncie; el anfitrion lo hace con child_settle (necesita
;   child_settle_ms > 0), como mucho 3 veces por clave, esperando 2, 4 y 8 s.
; combat_follow (SOLO ANFITRION): 0 | probe | 1. Los enemigos que este cliente simula y que pelean con el usuario 2
;   (a <= 25 m) mandan al invitado MoveActorAck sinteticos a ~16 Hz leidos de la memoria de este cliente.
; guest_horse_probe (SOLO ANFITRION): 0 | probe. Mide la cadencia del jinete invitado frente a su caballo y construye
;   (sin enviarla nunca) la 2556 sintetica del caballo.
ride_filter=1
; P8 monturas (pendientes/p8-impl-monturas.md). mount_sync (EN LOS DOS PCs): 0 | probe | 1.
;   probe: sondas de la etapa 1 (vf53 0x2228260 y su thunk 0xA45740, RideOff 0x2228E40, vf54 0xA45760, RideOn/
;   RideOff::Enter, 2663/2916, StartActionAck 0xB57720) y los eventos MountBegin/MountCommit/MountDetach del
;   personaje PROPIO por el tunel (control 5); el otro PC apunta lo que haria (args exactos), sin retener, llamar
;   ni escribir nada. 1: ademas el observador retiene el flujo hasta el Commit (<= 500 ms), reproduce 0x2228260
;   en el hilo principal antes de la accion de montar, comprueba las postcondiciones y deja pasar la accion
;   original (ride_filter se aplaza solo para esa transaccion). Sesion 17 (sondas): orden, argumentos (asiento 0,
;   quinto 0) y juicio 'apply' en las 8 monturas; el desmontaje de un jugador no pasa por 0x2228E40: el controlador
;   vigila ahora su propio vinculo y publica un Detach 'observado' (bandera 12, p4 0). SESION 18: 1 SOLO EN EL
;   ANFITRION (observa al invitado con el vinculo nativo); el invitado sigue en probe. Abortar: documento, Sesion 17.
;   APAGAR: mount_sync=0 (todo como antes); solo sondas: mount_sync=probe.
mount_sync=1
; P8 SESION 18/19, ride_dismount (pendientes/p8-impl-monturas.md 11; p8-s18-desmontar-nativo.md 6): rewrite | partial |
;   native, en los DOS PCs. Causa de S18 [V codigo]: toda accion recibida por la red lleva el bit 1 de entrada+0x50 y la
;   puerta del CC (.xtls 0xEE58A40, tras el thunk 0x2329A90) la descarta mientras la accion actual/pendiente tenga
;   def+0xA & 0x40 ('bajar del vehiculo'); la copia remota no ejecuta su chart (actor+0x96 = 0) y se queda en RideOff.
;   native (ARREGLO B, solo con mount_sync=1): RideOff nativo con animacion completa; el desvio del thunk 0x2329A90 deja
;     pasar la siguiente accion de red SOLO del jinete remoto atascado (metodo 7 con una accion 0x40) con una copia
;     propia de las dos entradas sin esos bits. Retirada del vinculo: la nativa (RideOff) o, a los 2 s, 0x2228E40 con
;     bandera 0 fuera de los metodos 6/7.
;   SI FALLA en el anfitrion (jinete atascado en el metodo 7, una 2223 propia con la clave del jinete del invitado,
;     cualquier fallo cerca de 0x2329A90 / 0xEE58A40, acciones del anfitrion afectadas): primero ride_dismount=partial
;     (ARREGLO A: solo se reescriben las acciones 0x40, C9356CEB / 412C2C2B; 667E3B35 pasa: media animacion, termina de
;     pie); si aun falla, ride_dismount=rewrite (S17: todo el desmontaje reescrito, sin animacion).
ride_dismount=native
; P8 SESION 21 (pendientes/p8-impl-monturas.md 13), EN LOS DOS PCs, solo con mount_sync=1: 0 | probe | 1.
;   mount_seat: sentar al jinete remoto en la silla con vf54 0xA45760 tras el vf53 del observador (tipo de enganche 4,
;     el hueso de la silla de ESTE cliente; sin esto se coloca con sus propias muestras de red y se separa hasta 1,4 m).
;     Si sigue sentado 1,5 s despues del desmontaje, una retirada 0x2228E40 (bandera 12). Retroceso: probe, luego 0.
;   ride_hold_pos: no aplicar la pose vacia al montar (tras RideOn::Enter el bufer queda vacio y 0x88E6A0 devolvia
;     (0,0,0): el parpadeo); se rellena con la pose actual del jinete remoto. Retroceso: probe (solo cuenta), luego 0.
; P8 SESION 22: el tipo 9 es "sin enganche" (S21 lo rechazaba como ocupado y nunca sento al jinete). Sentado,
;   el arranque de RideOn sale de su pose (no del origen) y el juego deja de aplicarle las muestras de red.
;   ride_hold_pos en probe: la salida de 0x88E6A0 ya llevaba la pose actual (la premisa de S21 era falsa).
mount_seat=1
ride_hold_pos=probe
child_reannounce=1
combat_follow=1
guest_horse_probe=probe
; P8 sesion 25: flujo de combate (noche/combate-retardo.md 6.1). combat_follow_v2 (SOLO ANFITRION; necesita
;   combat_follow=1): 0 | probe | 1. 1: ademas los enemigos que pelean con CUALQUIER personaje (tambien el anfitrion) a
;   <= 35 m del usuario 2, cada 33 ms (temporizador de alta resolucion, sin deriva), en cuanto se mueven > 1e-4 m (el
;   umbral del juego), keepalive de 100 ms con la misma pose, sin el corte de 3 s sin muestra real, los 12 mas cercanos.
;   v2 con tabla, hilo y reloj propios. probe: v1 manda exactamente como hasta ahora y v2 se decide al lado y se cuenta
;   (linea 'CombatFollow v2 probe'). Primera sesion de dos PCs: probe (invitado remote_interp_combat=probe);
;   despues 1 en los dos. Volver: 0.
combat_follow_v2=probe
; P8 sesion 25: ancla del mundo en el invitado (noche/mundo-invitado.md, seccion "Implementado"). SOLO ANFITRION;
;   0 | probe | 1. El recolector de actores del servidor (cada 5 s) solo conserva los NPC cerca del personaje del
;   anfitrion o del actor de la ranura "observador de mundo" del campo ([campo+0x2E4]/[campo+0x2E8], libre en la
;   partida normal): a ~250 m del anfitrion desaparece todo lo que rodea al invitado. 1 = esa ranura es el personaje
;   del usuario 2 mientras esta en un campo del anfitrion (se escribe en ServerRunThread con el cerrojo del campo;
;   se quita en su 2437/2283/2001 y si se va sin 2001). probe = solo lineas 'WorldAnchor [probe] would ...' y la
;   lectura de la ranura. Los dos miden cada minuto las bajas de motivo 25 cerca del usuario 2 ('WorldAnchor
;   [minute]'). Apagar: 0.
user2_world_anchor=1
; P8 S25 remates/derribos del invitado (s25/finisher-sigilo.md), SOLO ANFITRION: probe = solo lineas 'CatchSeq [probe]' de cada agarre.
catch_seq=probe
; P8 S1 opcion A, tramo de SECUENCIADORES (pendientes/p8-impl-opcion-a.md). SOLO ANFITRION; 0 | probe (decide y lo
;   escribe, no envia ni descarta nada) | 1. Necesita [sniffer] enabled=1 (el libro sale de la captura del cliente
;   propio) y, en el invitado, guest_seq_route=1 (sin el, el invitado descarta las copias antes de su cliente).
; observer_seq_copy: los 2661 (con su 2981 si el usuario 2 no lo tiene) de los secuenciadores del Kliff del anfitrion
;   van al usuario 2 byte a byte DESPUES del 2005 de todos sus actores enlazados y del 2322 propio del usuario 2 (S2);
;   los 2661 nuevos durante la estancia tambien; el 2810 de uno ya copiado se copia. Lineas 'ObserverSeqCopy [...]'.
; observer_seq_copy_only: ids de secuenciador en hex (o claves de actor B... enlazadas); vacio = todos. Los ids de la
;   sesion 7 (Grover 1AB, Dahlia 1AD, posadero 1A9, Street Vendor 19E) pueden cambiar: si en el log del anfitrion
