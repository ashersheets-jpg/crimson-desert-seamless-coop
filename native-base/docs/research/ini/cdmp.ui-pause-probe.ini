; cdmp.ini - rama opcion-d, P8 pausa del ESC, prueba T0 (SONDA, un PC, un jugador, sin Shadow).
; Documento: docs/research/pendientes/p8-pausa-esc.md, seccion "Implementado", T0.
; Solo lectura: el gancho de 0x35CD990 devuelve SIEMPRE el valor original (el juego pausa como siempre).
; Registra cada cambio del timeScale de la UI con la vista/raiz (clase RTTI) que lo pide, y cada 5 s mientras
; dura, cuanto avanza el reloj de juego (debe quedar en +0 ms con un menu que pausa).
; Lineas a buscar en bin64\cdmp.log: 'UiPause ON', 'UiPause [probe]', 'UiPause clock', 'UiPause summary', 'UiPause per UI'.
; Sin [net]: no hace falta cdmp_peer. Sin create_session: no se escribe nada mas en el juego (ni guardian de guardado).
[general]
player_name=Player

[net]
enabled=0

[overlay]
enabled=1
self_marker=0

[sniffer]
; la captura del cliente propio trae los ServerTimeInfoAck 2188: analyze_capture.py <captura> ticks
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
probe=1
ui_pause_block=probe
