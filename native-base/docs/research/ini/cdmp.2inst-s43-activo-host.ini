; S43 ACTIVO ANFITRION (docs/research/s25/s43-puertas-y-r42.md). Base exacta: cdmp.2inst-s42-activo-host.ini.
; Cambios respecto a la base: door_trace=1 (detalle de cada 2928/2145/2953 y del resultado nativo) y scene_level_share=1 (solo anfitrion:
;   A pone eax := dueno en la puerta de dueno 0x283044D para el 2598/2104 del usuario 2; B omite SOLO el
;   borrado del 2834 de un nivel que el otro usuario sigue teniendo cargado, con el hash verificado; 0x2836110 y
;   el cargador solo observan). Usar solo si el paso probe cumple los criterios del documento.
; El arreglo de motivo 42 (8f827a2) es de codigo: no tiene clave. Reiniciar ambos procesos entre pasos.
; ---- cabecera de la base, conservada:
; S42 ACTIVO HOST. Base exacta: cdmp.2inst-host-carros-1.ini.
; SOLO OBSERVACION: npc_family_vehicles=1 se degrada a probe, NO asigna vehiculos.
; enemy_damage_probe=1 y door_trace=1 aumentan detalle; NO arreglan combate ni puertas.
; "activo" significa diagnostico ampliado. La particion/fallback conocida seguira ocurriendo.
; Reiniciar ambos procesos entre pasos. No desplegado ni ejecutado automaticamente.
; S40 carros, PASO 2 (1), dos copias, ANFITRION (docs/research/s25/s40-carros.md): igual que
; cdmp.2inst-host-todo-D1.ini (fases A, E, B, C y D a 1) + user2_road_carts=1: los caballos con jinete y los carros
; del invitado se asignan ENTEROS al invitado (sus gimmicks y su carga siguen con el anfitrion). Solo despues de que
; el paso 1 (cdmp.2inst-host-carros-probe.ini) cumpla los criterios de s40-carros.md 6.1.
; Invitado: cdmp.2inst-guest.ini sin cambios.
; ---- cabecera de la base (cdmp.2inst-host-todo-D1.ini), conservada:
; Dos copias: fases A, E, B (1), C (1, carros fuera) y D (1) juntas (15-10).
; Dos copias, fase B ACTIVA (npc_family_control=1); resto igual que cdmp.2inst-host.ini.
; DOS INSTANCIAS EN UN PC, ANFITRION (docs/research/dos-instancias.md): bin64\cdmp.host.ini del proceso con CDMP_ROLE=host.
; Lo instala scripts\launch-2inst.ps1 (-HostIni). Base: cdmp.p8-s36-host-paso1.ini (kit S36, paso 1). Solo cambian
; [general] player_name y [net]: UDP en vez de Steam (las dos copias comparten SteamID), anfitrion de red escuchando en
; 127.0.0.1:37015 (host_loopback_only=1: fuera de la LAN y del cortafuegos), el mismo puerto que usa cdmp_peer: no
; arranques cdmp_peer a la vez. [session2] es identico al del kit (guest_own_save=1 funciona por UDP: id "unknown").
; ---- cabecera de la base (cdmp.p8-s36-host-paso1.ini), conservada:
; S36 fase B, PRUEBA CON SHADOW, PASO 1, ANFITRION: fase A activa (cdmp.p8-s35-host-paso2.ini) +
; npc_family_control=probe, npc_family_types=3,6. Mide familias sin cambiar nada. Shadow: cdmp.p8-s36-shadow.ini.
; Ver docs/research/s25/s36-fase-b.md (plan de prueba 5.2, paso 1). Base conservada: cdmp.p8-s35-host-paso2.ini;
; solo cambia la clave npc_family_control (y se anade npc_family_types) en [session2].
; S35 fase A, PRUEBA CON SHADOW, PASO 2, ANFITRION: npc_activation=1 y claves S35 a 1 (solo si el paso 1 cumple
; los criterios de docs/research/s25/s35-fase-a.md). Shadow: cdmp.p8-s35-shadow.ini (el mismo en los dos pasos).
; Base conservada: docs/research/s25/s33-npc-paso2-host.ini (kit S34). Solo cambian npc_activation y el bloque S35 de [session2].
; S34: quest_policy=probe (no 1) en los dos pasos: la politica de misiones de c7ae132 (host_credit) aun no esta probada en un PC; asi la prueba de NPC no mezcla dos cambios y se mide la de misiones.
; S33 NPC, paso 2, host. Base conservada: cdmp.p8-s33-host-paso2.ini.
; Paso1 observa. Paso2 sólo anfitrión retira localmente; Shadow sigue observando.
; No cambia autoridad de familias/viajeros. Reiniciar ambos procesos entre pasos.
; Documento: docs/research/s25/s33-npc-implementacion.md. No desplegado automáticamente.
[general]
player_name=Host
; dos instancias: la copia sin el foco conserva su parte de la GPU (dos-instancias.md 2.6; solo con CDMP_ROLE)
background_full_speed=1

[net]
enabled=1
; dos instancias: UDP por loopback; este proceso escucha y el invitado se conecta
transport=udp
role=host
peer_port=37015
host_loopback_only=1

[steam]
; dos instancias: sin uso con transport=udp (se conserva por si se vuelve a Steam)
; Vacio = acepta a cualquier amigo que este jugando a Crimson Desert.
peer_steamid=
channel=67
; p8-hilo-red.md 2.5: iguales en el anfitrion y en Shadow
recv_buffer_kb=16384
recv_buffer_messages=16384

[overlay]
enabled=1
self_marker=0

[sniffer]
; captura del cliente propio del anfitrion (cdmp_packets_*.bin en bin64): imprescindible para el cruce y, con
; s1_scene_diag=1, la fuente del libro de escenas (2335/2126/2411/2661/2810/2874 hacia la sesion 1)
enabled=1
record=1

[coop]
enabled=0

[session2]
