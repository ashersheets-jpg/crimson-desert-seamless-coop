; cdmp.ini - rama opcion-d, P8 en SHADOW (invitado real) con las sondas y la contencion de S3.
; Igual que cdmp.p8-shadow-diag.ini (guest_actor_diag=1, guest_layer_guard=1) mas tres claves del invitado
; (docs/research/pendientes/p8-impl-s3.md):
;   guest_s3_diag=1       solo lectura, sin llamar al motor: historial por actor de la primera accion (2005 recibido
;                         con su byte de restauracion, resultado de la restauracion, primer Update 0x85FBA0, 2723 en
;                         0x48B120 + AL de vf188(5) en 0x48B197, 2991 en 0x48AD40, resultado de StartAction 0x863530
;                         y si la accion quedo instalada) y, si 0x232D5C0 entra con la accion actual nula, las capas,
;                         el CC y los flags del actor. Lineas "GuestS3" en cdmp.log, formateadas cada 5 s.
;   guest_crash_dump=1    ante un acceso invalido en el codigo del juego (.rsrc): las ultimas lineas del historial
;                         en cdmp.log y un minidump junto a cdmp.asi (local; no se envia nada). No maneja la
;                         excepcion: el juego y K1 siguen igual.
;   guest_update_guard=1  CONTENCION, no arreglo: 0x232D5C0 vuelve en seguida para un actor que no controla este
;                         PC y cuya accion actual es nula (el acceso de 0x232D5FF). Registra cada clave y si despues
;                         recibio accion; las que no, salen como STUCK.
; guest_actor_diag=1 se mantiene: su salida de la restauracion alimenta el historial de S3.
; Una sola sesion de diagnostico; para jugar normal, vuelve a cdmp.p8-shadow.ini.
[general]
player_name=Shadow

[net]
enabled=1
transport=steam
role=guest

[steam]
; Vacio = el unico amigo que este jugando a Crimson Desert ahora mismo (el anfitrion).
peer_steamid=
channel=67

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
guest=1
guest_mode=remote
guest_actor_diag=1
guest_layer_guard=1
guest_s3_diag=1
guest_crash_dump=1
guest_update_guard=1
