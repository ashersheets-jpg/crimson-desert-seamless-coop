; cdmp.ini - rama opcion-d, P8 en SHADOW (invitado real) CON DIAGNOSTICO DE ACTORES DEL ANFITRION.
; Igual que cdmp.p8-shadow.ini mas dos claves del invitado (docs/research/pendientes/p8-actores-anfitrion.md,
; seccion "Implementado para el diagnostico"):
;   guest_actor_diag=1   sonda de solo lectura: logins fallidos (FinishGroup 0x4FD491), restauracion de
;                        acciones de actores remotos (0x8646FC / 0x864B1D) y, cada 5 s, el estado de carga
;                        [P+0x15C] y su lista de espera. Lineas "GuestDiag" en cdmp.log.
;   guest_layer_guard=1  guarda de capas del cooperativo (0x1F63F70 / 0x2329700) para todo actor cuyo
;                        +0x90 no es el usuario local. No cambia nada para los actores propios.
; Una sola sesion de diagnostico; para jugar normal, vuelve a cdmp.p8-shadow.ini.
[general]
player_name=Shadow

[net]
enabled=1
transport=steam
role=guest

[steam]
; Vacio = el unico amigo que este jugando a Crimson Desert ahora mismo (el anfitrion).
peer_steamid=
channel=67

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[session2]
enabled=1
guest=1
guest_mode=remote
guest_actor_diag=1
guest_layer_guard=1
