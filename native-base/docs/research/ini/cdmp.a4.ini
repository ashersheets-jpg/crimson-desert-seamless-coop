; cdmp.ini - rama opcion-d, prueba A4 (T16, A5-IN1): donde empieza la exploracion libre
; Partida NUEVA en una ranura vacia. Ctrl+F12 deja una marca numerada en el log.
; El cooperativo de main esta guardado en cdmp.ini.main-coop
[general]
player_name=Player

[net]
; hace falta: las marcas de Ctrl+F12 las escribe el bucle de red (no conecta con nadie)
enabled=1
role=guest
peer_host=127.0.0.1
peer_port=37015

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
; graba cdmp_packets_<fecha>.bin/.log (50-100 MB por sesion)
record=1

[coop]
enabled=0

[session2]
; A4 no usa la opcion D
enabled=0
