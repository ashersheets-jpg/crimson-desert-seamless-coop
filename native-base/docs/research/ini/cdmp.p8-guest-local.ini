; cdmp.ini - rama opcion-d, prueba LOCAL del lado invitado (sin red, modo observe): instalacion de todas las sondas/guardas del invitado en una partida normal.
; Diagnostico de solo lectura (guest_actor_diag, guest_s3_diag, load_diag, s1_diag), captura de cierre local (guest_crash_dump)
; y dos CONTENCIONES (guest_layer_guard, guest_update_guard). crashpad_handler.exe sigue fuera de bin64 (K2).
